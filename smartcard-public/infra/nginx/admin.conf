# admin.reymensolutions.mx -> apps/admin (puerto 3001).
# Fase 15 -- instalar en /etc/nginx/sites-available/admin.conf y enlazar:
#   ln -s /etc/nginx/sites-available/admin.conf /etc/nginx/sites-enabled/
#
# Mismo comentario que link.conf sobre el bloque 443 y certbot.

server {
    listen 80;
    listen [::]:80;
    server_name admin.reymensolutions.mx;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.reymensolutions.mx;

    ssl_certificate     /etc/letsencrypt/live/admin.reymensolutions.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.reymensolutions.mx/privkey.pem;

    # Subir foto/logo (Fase 14) acepta hasta 5 MB por archivo -- el default
    # de Nginx (1 MB) rechazaría con 413 cualquier subida de más de 1 MB
    # ANTES de que le llegue a Next.js, sin que el mensaje de error de la
    # app ("La foto debe ser PNG, JPG o WEBP" / "pesa más de 5 MB") tenga
    # oportunidad de mostrarse -- por eso este límite tiene que subirse aquí
    # también, no solo validarse en el código de la app.
    client_max_body_size 8m;

    location / {
        limit_req zone=reymen_admin burst=30 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
