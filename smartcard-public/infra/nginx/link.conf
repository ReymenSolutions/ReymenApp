# reymensolutions.mx + link.reymensolutions.mx -> apps/public (puerto 3000).
# Fase 15 -- instalar en /etc/nginx/sites-available/link.conf y enlazar:
#   ln -s /etc/nginx/sites-available/link.conf /etc/nginx/sites-enabled/
#
# El bloque 443 de abajo asume que ya corriste certbot (ver FASE15.md,
# sección "Cuando el dominio esté listo") -- si todavía no tienes
# certificado, comenta ese bloque completo y deja solo el de escucha en 80
# (certbot en modo --nginx puede generarlo y reescribir este archivo solo).

server {
    listen 80;
    listen [::]:80;
    server_name reymensolutions.mx www.reymensolutions.mx link.reymensolutions.mx;

    # Certbot necesita este path libre en HTTP para validar el dominio antes
    # de que exista certificado -- no lo quites aunque ya tengas HTTPS (los
    # renovaciones automáticas lo vuelven a usar).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reymensolutions.mx www.reymensolutions.mx link.reymensolutions.mx;

    ssl_certificate     /etc/letsencrypt/live/reymensolutions.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reymensolutions.mx/privkey.pem;

    # /n/{code} y /q/{code} llevan su propia zona, más restrictiva --
    # ver infra/nginx/rate-limits.conf.
    location ~ ^/(n|q)/ {
        limit_req zone=reymen_redirects burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        limit_req zone=reymen_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
