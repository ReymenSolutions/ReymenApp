# Fase 15 -- cabeceras de proxy compartidas por link.conf y admin.conf.
# Instalar en /etc/nginx/snippets/proxy-common.conf.
#
# `getAdminUrl()`/`getSiteUrl()` (apps/admin/lib/admin-url.ts,
# apps/public/lib/site-url.ts) NO dependen de X-Forwarded-Proto -- deciden
# http:// vs https:// mirando si el header `Host` empieza con
# "127.0.0.1"/"localhost", así que funcionan igual detrás de este proxy sin
# tocar nada. X-Forwarded-Proto se manda de todos modos porque es la
# convención estándar detrás de cualquier reverse proxy (lo esperan
# herramientas de logging/monitoreo, y cualquier código futuro que sí lo
# necesite ya lo tiene disponible) -- no porque algo de este proyecto lo lea
# hoy.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_cache_bypass $http_upgrade;
