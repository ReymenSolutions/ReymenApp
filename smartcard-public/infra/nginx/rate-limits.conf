# Fase 15 (preparar para producción).
#
# `limit_req_zone` SOLO puede declararse dentro del bloque `http {}` de
# /etc/nginx/nginx.conf -- por eso vive en su propio archivo en vez de
# dentro de link.conf/admin.conf (esos son server{} blocks, un nivel más
# adentro; ahí solo se puede USAR una zona ya declarada, no declararla).
#
# Instalación: copia este archivo a /etc/nginx/rate-limits.conf y agrega,
# dentro del bloque http{} existente de nginx.conf (normalmente ya trae uno
# con `include /etc/nginx/conf.d/*.conf;` o similar):
#
#   include /etc/nginx/rate-limits.conf;
#
# Volúmenes conservadores para el tamaño actual del proyecto
# (ARCHITECTURE.md sección 9: "sin Redis en V1, Nginx limit_req_zone a nivel
# de borde para las rutas públicas más sensibles a abuso") -- son un punto
# de partida razonable, no un número medido contra tráfico real. Súbelos o
# bájalos si en producción resultan demasiado (o muy poco) estrictos.

# /n/{code} y /q/{code} -- lo más expuesto a abuso (alguien recorriendo
# códigos de tarjeta uno por uno). Cada visita ya registra un evento en la
# base de datos -- limitar aquí también protege esa tabla de llenarse de
# ruido, no solo el servidor de Next.js.
limit_req_zone $binary_remote_addr zone=reymen_redirects:10m rate=10r/s;

# Resto de apps/public (el perfil en sí, los botones de contacto, el vCard).
limit_req_zone $binary_remote_addr zone=reymen_general:10m rate=30r/s;

# apps/admin completo -- un panel interno de pocos usuarios no necesita ser
# tan permisivo como el sitio público, pero tampoco tan estricto como las
# rutas de redirección (aquí sí hay gente usándolo activamente).
limit_req_zone $binary_remote_addr zone=reymen_admin:10m rate=15r/s;
