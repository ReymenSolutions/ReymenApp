name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  NEXTAUTH_SECRET: ci-only-secret-not-for-production-use-abcdefgh
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  N8N_WEBHOOK_SECRET: ci-only-webhook-secret

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: docker.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: reymen_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/reymen_ops_test
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/reymen_ops_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to test database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    strategy:
      fail-fast: false
      matrix:
        scenario: [legacy, center, feature-rollback]

    services:
      postgres:
        image: docker.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: reymen_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/reymen_ops
      # La suite e2e inicia sesión más de 20 veces desde la misma IP; con el
      # límite de producción (20 por IP cada 10 min) las últimas pruebas fallan.
      LOGIN_IP_RATE_LIMIT: "1000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        shell: bash
        run: |
          export AI_AGENT_MODEL_ENABLED=false AI_AGENT_CENTER_UI_ENABLED=false
          export AI_CHANNEL_CONNECTIONS_ENABLED=false AI_KNOWLEDGE_ACCESS_ENABLED=false AI_MARK_SANDBOX_ENABLED=false
          case "${{ matrix.scenario }}" in
            legacy)
              export E2E_AI_UI_ROLLBACK=true
              specs=()
              for spec in e2e/*.spec.ts; do
                case "$spec" in
                  e2e/ai-center-phase2.spec.ts|e2e/channel-connections*.spec.ts|e2e/knowledge-access*.spec.ts|e2e/mark-sandbox*.spec.ts) continue ;;
                esac
                specs+=("$spec")
              done
              ;;
            center)
              export AI_AGENT_MODEL_ENABLED=true AI_AGENT_CENTER_UI_ENABLED=true
              export AI_CHANNEL_CONNECTIONS_ENABLED=true AI_KNOWLEDGE_ACCESS_ENABLED=true AI_MARK_SANDBOX_ENABLED=true
              specs=(e2e/ai-center-phase2.spec.ts e2e/channel-connections.spec.ts e2e/knowledge-access.spec.ts e2e/mark-sandbox.spec.ts e2e/rulebook.spec.ts e2e/inbox.spec.ts e2e/conversation-manual-reply.spec.ts e2e/webhook-retry-cron.spec.ts)
              ;;
            feature-rollback)
              export AI_AGENT_MODEL_ENABLED=true AI_AGENT_CENTER_UI_ENABLED=true
              export E2E_CHANNEL_ROLLBACK=true E2E_KNOWLEDGE_ROLLBACK=true E2E_MARK_ROLLBACK=true
              specs=(e2e/channel-connections-rollback.spec.ts e2e/knowledge-access-rollback.spec.ts e2e/mark-sandbox-rollback.spec.ts)
              ;;
          esac
          npx playwright test "${specs[@]}" --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.scenario }}
          path: playwright-report/
          retention-days: 7
