# Private Docker-network listener only; this port is never published on the VPS.
# No CONNECT, arbitrary host/path, logs of requests or upstream retries.
server {
    listen 8081;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=60s;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 6s;
    proxy_send_timeout 6s;
    location = /v1/messages {
        limit_except POST { deny all; }
        set $anthropic_host api.anthropic.com;
        proxy_ssl_name api.anthropic.com;
        proxy_set_header Host api.anthropic.com;
        proxy_pass https://$anthropic_host/v1/messages;
    }
    location = /fx {
        limit_except GET { deny all; }
        set $fx_host api.frankfurter.dev;
        proxy_pass_request_headers off;
        proxy_set_header Host api.frankfurter.dev;
        proxy_ssl_name api.frankfurter.dev;
        proxy_pass https://$fx_host/v1/latest?base=USD&symbols=MXN;
    }
    location / { return 404; }
}
