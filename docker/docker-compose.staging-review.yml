# Explicit paid-review opt-in; never loaded by the default staging commands.
services:
  app:
    environment:
      AI_MARK_PRIVATE_REVIEW_ENABLED: "true"
      AI_MARK_PILOT_GATEWAY_ENABLED: "true"
      AI_MARK_PILOT_BUDGET_ENABLED: "true"
      AI_KNOWLEDGE_ACCESS_ENABLED: "true"
      AI_MARK_PILOT_MODEL: ${STAGING_MARK_MODEL:?Configure a reviewed model first}
      AI_MARK_PILOT_ANTHROPIC_API_KEY: ${STAGING_MARK_ANTHROPIC_API_KEY:?Configure a dedicated staging key first}
      AI_MARK_PILOT_PROXY_URL: http://ingress:8081
  ingress:
    volumes:
      - ./nginx.staging-anthropic.conf:/etc/nginx/private/anthropic.conf:ro
